name: recorder-ci
on:
  push:
    paths:
      - 'recorder/**'
      - '.github/workflows/recorder-ci.yml'
  pull_request:
    paths:
      - 'recorder/**'
      - '.github/workflows/recorder-ci.yml'

jobs:
  hello-world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install noto-cjk
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Install recorder plugin
        working-directory: recorder
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Install Playwright browsers
        working-directory: recorder
        # v0.2.4 audit round 3 (C6): INSTALL.md:33 explicitly warns that
        # the npm-global `playwright` binary in $PATH silently no-ops on
        # `install chromium` on macOS / some monorepos. The CI was doing
        # exactly that. Always use `python -m` to invoke the pip-installed
        # playwright, not whatever happens to be on PATH.
        run: python -m playwright install --with-deps chromium
      - name: Hello-world Playwright launch
        working-directory: recorder
        run: |
          python -c "
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(headless=True, args=['--no-sandbox'])
                  page = await b.new_page()
                  await page.goto('about:blank')
                  print('hello world from Playwright')
                  await b.close()
          asyncio.run(main())
          "
      - name: Verify ffmpeg
        run: ffmpeg -version | head -1
      # F5 fix (v0.2.4 audit): the previous CI only did a Playwright
      # hello-world — it never actually ran the recorder test suite.
      # Add a unit-only pytest run that does NOT need a browser
      # (so this is fast and reliable). Browser-dependent tests
      # run on local dev only; the CI gate is "do unit tests pass
      # in a clean environment?".
      - name: Run recorder unit tests (no browser required)
        working-directory: recorder
        run: |
          python -m pytest tests/unit/ -v --tb=short
      # F5.2: also exercise the CLI entry points so a broken
      # command surface (typo in subcommand, missing help text)
      # gets caught before the next push.
      - name: Smoke-test the CLI subcommands
        working-directory: recorder
        run: |
          python -m recorder_plugin.cli --version
          python -m recorder_plugin.cli --help
          python -m recorder_plugin.cli apply-ai-responses /tmp/rec-ci-smoke-no-such-dir || true
